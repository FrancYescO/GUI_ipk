name: Publish verified OPKG feeds
on:
  pull_request:
    paths: ['scripts/**', 'tests/**', 'build/publication/**', 'build/application-archive/**', 'build/kernel-*/**', 'artifacts/**', '.github/workflows/publish-opkg-feed.yml']
  push:
    branches: [main]
    paths: ['scripts/**', 'tests/**', 'build/publication/**', 'build/application-archive/**', 'build/kernel-*/**', 'artifacts/**', '.github/workflows/publish-opkg-feed.yml']
  workflow_dispatch:
    inputs:
      reuse_userspace_run_id:
        description: Optional complete successful userspace build run
        required: false
        type: string
  workflow_run:
    workflows: ['Userspace OPKG feed (brcm63xx-tch)']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.reuse_userspace_run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        with:
          path: .publication-cache
          key: publication-ipks-${{ github.run_id }}
          restore-keys: publication-ipks-
      - name: Test publication and kernel validation
        run: python3 -m unittest discover -s tests
      - name: Restore durable complete userspace and promoted updates
        run: python3 scripts/fetch-publication-inputs.py baseline applications .publication-cache
      - name: Select explicitly requested successful complete build
        if: env.SOURCE_RUN != ''
        run: |
          python3 scripts/select-userspace-feed-run.py "$GITHUB_REPOSITORY" --run-id "$SOURCE_RUN"
      - name: Download selected complete build
        if: env.SOURCE_RUN != ''
        uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}
          pattern: userspace-opkg-feed-*
          merge-multiple: true
          path: fresh
      - name: Adopt verified complete build
        if: env.SOURCE_RUN != ''
        run: |
          # Replace only after provenance and full-feed selection succeeded.
          rm -rf baseline
          mv fresh baseline
      - name: Overlay verified updates and prepare coherent components
        run: |
          python3 scripts/overlay-openvpn-feed.py baseline
          python3 scripts/prepare-publication.py baseline applications publication
          python3 scripts/render-publication.py publication
          bash scripts/verify-feed.sh publication/site
      - name: Publish immutable component releases before Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: python3 scripts/publish-components.py publication --revision "$GITHUB_SHA"
      - name: Retain publication manifest
        uses: actions/upload-artifact@v7
        with:
          name: publication-manifest-${{ github.sha }}
          path: publication/catalog.json.gz
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: publication/site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified feed
        id: deployment
        uses: actions/deploy-pages@v5
