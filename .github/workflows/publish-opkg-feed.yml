name: Publish verified OPKG feeds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-opkg-feed.yml"
      - "base/**"
      - "luci/**"
      - "packages/**"
      - "routing/**"
      - "telephony/**"
      - "target/packages/**"
      - "artifacts/damson-4.1.52-manual/**"
      - "scripts/verify-feed.sh"
      - "scripts/generate-feed-pages.py"
      - "scripts/assemble-kernel-feed.py"
      - "scripts/verify-manual-kmod-ipks.sh"

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  verify:
    name: Verify versioned OPKG feeds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Assemble userspace-only feed
        run: |
          mkdir -p dist/target
          cp -a base luci packages routing telephony dist/
          cp -a target/packages dist/target/
          touch dist/.nojekyll

      - name: Reject kernel packages and invalid indexes
        run: scripts/verify-feed.sh dist

      - name: Verify Damson kernel IPKs
        run: |
          (cd artifacts/damson-4.1.52-manual && sha256sum --check SHA256SUMS)
          scripts/verify-manual-kmod-ipks.sh artifacts/damson-4.1.52-manual

      - name: Assemble 4.1.52 kernel feed
        run: python3 scripts/assemble-kernel-feed.py artifacts/damson-4.1.52-manual dist

      - name: Verify combined feed
        run: scripts/verify-feed.sh dist --allow-kmods

      - name: Generate browsable package pages
        run: python3 scripts/generate-feed-pages.py dist

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    name: Publish verified feed to Pages
    needs: verify
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy package feed
        id: deployment
        uses: actions/deploy-pages@v5
