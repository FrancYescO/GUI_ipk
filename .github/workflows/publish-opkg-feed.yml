name: Publish verified userspace OPKG feed

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-opkg-feed.yml"
      - "base/**"
      - "luci/**"
      - "packages/**"
      - "routing/**"
      - "telephony/**"
      - "target/packages/**"
      - "scripts/verify-feed.sh"

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  verify:
    name: Verify userspace-only feed
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Assemble userspace-only feed
        run: |
          mkdir -p dist/target
          cp -a base luci packages routing telephony dist/
          cp -a target/packages dist/target/
          touch dist/.nojekyll

      - name: Reject kernel packages and invalid indexes
        run: scripts/verify-feed.sh dist

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    name: Publish verified feed to Pages
    needs: verify
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy userspace-only feed
        id: deployment
        uses: actions/deploy-pages@v5
