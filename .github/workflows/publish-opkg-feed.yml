name: Publish verified OPKG feeds

on:
  pull_request:
    paths:
      - ".github/workflows/publish-opkg-feed.yml"
      - "artifacts/damson-4.1.52-rndis-compat/**"
      - "artifacts/vbnto-4.1.38-manual/**"
      - "scripts/assemble-kernel-feed.py"
      - "scripts/verify-vbnto-4.1.38-ipks.py"
      - "scripts/report-feed-dependencies.py"
      - "scripts/verify-manual-kmod-ipks.sh"
      - "tests/test_rndis_feed.py"
      - "artifacts/openvpn-2.6.23/**"
      - "scripts/overlay-openvpn-feed.py"
      - "tests/test_openvpn_feed.py"
  workflow_dispatch:
    inputs:
      reuse_userspace_run_id:
        description: "Optional userspace run whose assembled feed should be preserved"
        required: false
        type: string
  workflow_run:
    workflows: ["Userspace OPKG feed (brcm63xx-tch)"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-opkg-feed.yml"
      - "base/**"
      - "luci/**"
      - "packages/**"
      - "routing/**"
      - "telephony/**"
      - "target/packages/**"
      - "artifacts/damson-4.1.52-manual/**"
      - "artifacts/damson-4.1.52-network/**"
      - "artifacts/damson-4.1.52-spu/**"
      - "artifacts/damson-4.1.52-rndis-compat/**"
      - "artifacts/buildroot-4.1.38/**"
      - "artifacts/vbnto-4.1.38-manual/**"
      - "scripts/verify-feed.sh"
      - "scripts/sanitize-opkg-feed.sh"
      - "scripts/generate-feed-pages.py"
      - "scripts/assemble-kernel-feed.py"
      - "scripts/verify-vbnto-4.1.38-ipks.py"
      - "scripts/report-feed-dependencies.py"
      - "scripts/verify-manual-kmod-ipks.sh"
      - "scripts/verify-wireguard-kmod.sh"
      - "scripts/verify-kmod-tun.sh"
      - "scripts/verify-kmod-connmark.sh"
      - "scripts/verify-kmod-spu.py"
      - "artifacts/openvpn-2.6.23/**"
      - "scripts/overlay-openvpn-feed.py"

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: Verify versioned OPKG feeds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Download completed userspace feed
        if: github.event_name == 'workflow_run' || inputs.reuse_userspace_run_id != ''
        uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id || inputs.reuse_userspace_run_id }}
          pattern: userspace-opkg-feed-*
          merge-multiple: true
          path: dist/

      - name: Assemble userspace-only feed
        if: github.event_name != 'workflow_run' && inputs.reuse_userspace_run_id == ''
        run: |
          mkdir -p dist/target
          cp -a base luci packages routing telephony dist/
          cp -a target/packages dist/target/
          touch dist/.nojekyll

      - name: Apply verified OpenVPN update
        run: |
          python3 -m unittest discover -s tests -p test_openvpn_feed.py
          python3 scripts/overlay-openvpn-feed.py dist

      - name: Remove kernel packages from shared feeds
        run: scripts/sanitize-opkg-feed.sh dist

      - name: Reject kernel packages and invalid indexes
        run: scripts/verify-feed.sh dist

      - name: Verify Damson kernel IPKs
        run: |
          (cd artifacts/damson-4.1.52-manual && sha256sum --check SHA256SUMS)
          scripts/verify-manual-kmod-ipks.sh artifacts/damson-4.1.52-manual
          (cd artifacts/damson-4.1.52-network && sha256sum --check SHA256SUMS)
          scripts/verify-manual-kmod-ipks.sh artifacts/damson-4.1.52-network
          test "$(find artifacts/damson-4.1.52-network -maxdepth 1 -name 'kmod-*.ipk' -type f | wc -l)" -eq 44

      - name: Verify built Linux 4.1.38 IPKs
        run: |
          (cd artifacts/buildroot-4.1.38 && sha256sum --check SHA256SUMS)
          scripts/verify-kmod-tun.sh artifacts/buildroot-4.1.38
          scripts/verify-kmod-connmark.sh artifacts/buildroot-4.1.38
          python3 scripts/verify-kmod-spu.py artifacts/buildroot-4.1.38 4.1.38

      - name: Verify router-tested DGA4131FWB 4.1.38 IPKs
        run: |
          (cd artifacts/vbnto-4.1.38-manual && sha256sum --check SHA256SUMS)
          python3 scripts/verify-vbnto-4.1.38-ipks.py artifacts/vbnto-4.1.38-manual

      - name: Verify router-tested RNDIS packages
        run: |
          (cd artifacts/damson-4.1.52-rndis-compat && sha256sum --check SHA256SUMS)
          scripts/verify-manual-kmod-ipks.sh artifacts/damson-4.1.52-rndis-compat
          python3 -m unittest discover -s tests -p test_rndis_feed.py

      - name: Verify tested SPU artifact
        run: |
          (cd artifacts/damson-4.1.52-spu && sha256sum --check SHA256SUMS)
          scripts/verify-manual-kmod-ipks.sh artifacts/damson-4.1.52-spu
          python3 scripts/verify-kmod-spu.py artifacts/damson-4.1.52-spu 4.1.52

      - name: Assemble versioned kernel feeds
        run: python3 scripts/assemble-kernel-feed.py artifacts/damson-4.1.52-manual dist --damson-extra-dir artifacts/damson-4.1.52-network --damson-spu-dir artifacts/damson-4.1.52-spu --damson-rndis-dir artifacts/damson-4.1.52-rndis-compat --buildroot-kernel-dir artifacts/buildroot-4.1.38 --vbnto-kernel-dir artifacts/vbnto-4.1.38-manual

      - name: Verify combined feed
        run: scripts/verify-feed.sh dist --allow-kmods

      - name: Audit dependencies against final kernel feeds
        run: |
          for kernel in 4.1.38 4.1.52; do
            python3 scripts/report-feed-dependencies.py dist \
              --extra-feed "kernel/$kernel" --output "dist/dependencies-$kernel"
            cat "dist/dependencies-$kernel/dependency-report.md" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Generate browsable package pages
        run: python3 scripts/generate-feed-pages.py dist

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    name: Publish verified feed to Pages
    if: github.event_name != 'pull_request'
    needs: verify
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy package feed
        id: deployment
        uses: actions/deploy-pages@v5
