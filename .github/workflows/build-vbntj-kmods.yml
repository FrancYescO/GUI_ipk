name: VBNT-K 4.1.52 kernel-module artifacts

run-name: VBNT-K 4.1.52 — ${{ inputs.module_set || 'network-feed' }}

on:
  workflow_dispatch:
    inputs:
      module_set:
        description: "Allowlisted kernel modules to build"
        required: true
        default: network-feed
        type: choice
        options:
          - tun
          - network-smoke
          - rndis-compat
          - qos-probe
          - router-tested
          - network-feed
          - wireguard
          - spu-probe
          - spu-cbc-probe
      wireguard_artifact_run_id:
        description: "Reverify existing WireGuard artifacts from this run without rebuilding"
        required: false
        type: string
  pull_request:
    paths:
      - ".github/workflows/build-vbntj-kmods.yml"
      - "build/vbntj/**"
      - "build/vbntj-canary/**"
      - "build/vbntj-spu-test/**"
      - "patches/vbntj-spu/**"
      - "scripts/build-damson-spu.sh"
      - "scripts/fetch-damson-kernel-toolchain.sh"
      - "scripts/verify-kmod-spu.py"
      - "patches/vbntj-4.1.52/**"
      - "patches/wireguard-linux-compat/**"
      - "scripts/build-vbntj-kmods.sh"
      - "scripts/apply-usb-rndis-compat.sh"
      - "scripts/normalize-usb-build-id.py"
      - "patches/usb-rndis/**"
      - "scripts/verify-manual-kmod-ipks.sh"
      - "scripts/verify-wireguard-kmod.sh"
      - "artifacts/damson-4.1.52-manual/**"
  push:
    branches:
      - codex/kmods-4.1.52-feed
    paths:
      - ".github/workflows/build-vbntj-kmods.yml"
      - "build/vbntj/**"
      - "build/vbntj-canary/**"
      - "build/vbntj-spu-test/**"
      - "patches/vbntj-spu/**"
      - "scripts/build-damson-spu.sh"
      - "scripts/fetch-damson-kernel-toolchain.sh"
      - "scripts/verify-kmod-spu.py"
      - "patches/vbntj-4.1.52/**"
      - "patches/wireguard-linux-compat/**"
      - "scripts/build-vbntj-kmods.sh"
      - "scripts/apply-usb-rndis-compat.sh"
      - "patches/usb-rndis/**"
      - "scripts/verify-manual-kmod-ipks.sh"
      - "scripts/verify-wireguard-kmod.sh"
      - "artifacts/damson-4.1.52-manual/**"

concurrency:
  group: vbntj-kmods-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: inputs.wireguard_artifact_run_id == ''
    name: Compile and verify ${{ inputs.module_set || 'network-feed' }} modules
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      GPL_REPOSITORY: https://github.com/avwarez/vmg8825_b50b.git
      GPL_REF: V5.17(ABNY.6)C0
      GPL_COMMIT: af23960e39003ba7788f5ced0c256b1bc676a712
      MODULE_SET: ${{ inputs.module_set || 'network-feed' }}
    steps:
      - uses: actions/checkout@v7

      - name: Verify committed router-tested packages
        run: |
          (cd artifacts/damson-4.1.52-manual && sha256sum --check SHA256SUMS)
          scripts/verify-manual-kmod-ipks.sh artifacts/damson-4.1.52-manual

      - name: Clone pinned GPL buildsystem
        run: |
          git clone --branch "$GPL_REF" --depth 1 "$GPL_REPOSITORY" .work/vbntj-gpl
          test "$(git -C .work/vbntj-gpl rev-parse HEAD)" = "$GPL_COMMIT"

      - name: Cache pinned GPL source archives
        uses: actions/cache@v6
        with:
          path: |
            .work/vbntj-gpl/dl/wireguard-linux-compat-1.0.20220627.tar.xz
            .work/vbntj-gpl/dl/linux-4.1.52.tar.xz
            .work/vbntj-gpl/dl/broadcom_sdk_502L07_pkg.tar.xz
            .work/vbntj-gpl/dl/broadcom_sdk_502L07_pkg.tar.bz2
            .work/vbntj-gpl/dl/binutils-2.28.1.tar.bz2
            .work/vbntj-gpl/dl/gcc-5.5.0.tar.bz2
            .work/vbntj-gpl/dl/glibc-2.26.tar.bz2
            .work/vbntj-gpl/dl/gmp-6.1.0.tar.xz
            .work/vbntj-gpl/dl/mpc-1.0.3.tar.gz
            .work/vbntj-gpl/dl/mpfr-3.1.4.tar.bz2
            .work/vbntj-gpl/dl/xz-5.0.4.tar.bz2
          key: vbntj-gpl-inputs-v3-af91860cb80100aa7d21b5118c3b0800319d2c6d5676a321fb1b7a1d65b06b50

      - name: Cache installed VBNT-K toolchain
        uses: actions/cache@v6
        with:
          path: |
            .work/vbntj-gpl/staging_dir/host
            .work/vbntj-gpl/staging_dir/toolchain-arm_v7-a_gcc-5.5.0_glibc-2.26_eabi
          key: damson-toolchain-linux-amd64-gcc-5.5.0-glibc-2.26-v1

      - name: Build Ubuntu 12.04 compatibility image
        run: docker build --platform linux/amd64 --tag vbntj-gpl-builder build/vbntj

      - name: Stage verified kernel compiler when cache is empty
        run: |
          if [[ ! -x .work/vbntj-gpl/staging_dir/toolchain-arm_v7-a_gcc-5.5.0_glibc-2.26_eabi/bin/arm-openwrt-linux-gnueabi-gcc ]]; then
            scripts/fetch-damson-kernel-toolchain.sh
            tar -xzf .cache/sources/damson-kernel-toolchain/damson-kernel-gcc-5.5.0-linux-amd64.tgz \
              --no-same-owner -C .work/vbntj-gpl
          fi

      - name: Prepare kernel and compile modules
        run: |
          set -o pipefail
          mkdir -p dist/vbntj-kmods
          sudo chown -R 1000:1000 .work/vbntj-gpl dist/vbntj-kmods
          if docker run --rm \
            --platform linux/amd64 \
            --env MODULE_SET \
            --env OUTPUT_DIR=/out \
            --env SOURCE_DIR=/app \
            --volume "$PWD:/repo" \
            --volume "$PWD/.work/vbntj-gpl:/app" \
            --volume "$PWD/dist/vbntj-kmods:/out" \
            vbntj-gpl-builder \
            /repo/scripts/build-vbntj-kmods.sh 2>&1 | tee damson-build.log; then
            :
          else
            grep -E 'error:|fatal error:|No rule to make target|Error [0-9]|Unexpected|Refusing' damson-build.log \
              | tail -n 20 | while IFS= read -r line; do
                echo "::error title=VBNT-K module build::$line"
              done || true
            exit 1
          fi

      - name: Verify built module imports against original VBNT-K firmware
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from firmware_kernel_candidates import audit_vbntk_ipks
          ipks = list(Path('dist/vbntj-kmods').glob('*.ipk'))
          if not ipks:
              raise SystemExit('No kernel IPKs available for offline symbol verification')
          report = audit_vbntk_ipks(ipks)
          print('Verified original-firmware symbol closure for', report['module_count'], 'modules')
          PY

      - name: Upload compile log after failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: damson-network-feed-failure-${{ github.sha }}
          path: damson-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify checksums
        run: cd dist/vbntj-kmods && sha256sum --check SHA256SUMS

      - name: Verify WireGuard module
        if: inputs.module_set == 'wireguard'
        run: scripts/verify-wireguard-kmod.sh dist/vbntj-kmods 4.1.52

      - name: Verify SPU module and no boot autoload
        if: inputs.module_set == 'spu-probe' || inputs.module_set == 'spu-cbc-probe'
        run: python3 scripts/verify-kmod-spu.py dist/vbntj-kmods 4.1.52

      - name: Verify manual-only IPK safety
        run: scripts/verify-manual-kmod-ipks.sh dist/vbntj-kmods

      - name: Match rebuilt modules to the exact validation registry
        run: python3 scripts/verify-runtime-payloads.py dist/vbntj-kmods build/vbntj/validation/results.json

      - name: Build isolated CBC userspace tools from pinned inputs
        if: inputs.module_set == 'spu-cbc-probe'
        run: |
          mkdir -p .work/cbc-tools dist/vbntj-kmods/spu-cbc-lab
          gh release download build-inputs-v1 --repo "$GITHUB_REPOSITORY" \
            --pattern toolchain-arm_cortex-a9+neon_gcc-4.8-linaro_glibc_eabi.tar --dir .work/cbc-tools
          echo "9961ab5df4b863d07ab72cbb31fb9d95e365d00c057961e981b6a9f52c113395  .work/cbc-tools/toolchain-arm_cortex-a9+neon_gcc-4.8-linaro_glibc_eabi.tar" | sha256sum -c -
          tar -xf .work/cbc-tools/toolchain-arm_cortex-a9+neon_gcc-4.8-linaro_glibc_eabi.tar -C .work/cbc-tools
          curl --fail --location --retry 3 https://sources.openwrt.org/openssl-1.0.2t.tar.gz --output .work/cbc-tools/openssl-1.0.2t.tar.gz
          sudo chown -R 1000:1000 .work/cbc-tools dist/vbntj-kmods/spu-cbc-lab
          docker run --rm --platform linux/amd64 --volume "$PWD:/repo" \
            --volume "$PWD/.work/cbc-tools:/tools" --volume "$PWD/dist/vbntj-kmods/spu-cbc-lab:/out" \
            vbntj-gpl-builder bash /repo/experiments/spu-cbc/build-userspace.sh \
            /tools/toolchain-arm_cortex-a9+neon_gcc-4.8-linaro_glibc_eabi/bin/arm-openwrt-linux-gnueabi- \
            /tools/openssl-1.0.2t.tar.gz /tools/build /out
          sudo chown -R "$(id -u):$(id -g)" dist/vbntj-kmods/spu-cbc-lab
          python3 experiments/spu-cbc/fetch-test-apps.py dist/vbntj-kmods/spu-cbc-lab/apps
          python3 experiments/spu-cbc/audit-bundle.py dist/vbntj-kmods/spu-cbc-lab
          python3 experiments/spu-cbc/manifest.py dist/vbntj-kmods/spu-cbc-lab
      - name: Upload isolated experimental CBC bundle
        if: inputs.module_set == 'spu-cbc-probe'
        uses: actions/upload-artifact@v7
        with:
          name: spu-cbc-4.1.52-vbntk-${{ github.sha }}
          path: dist/vbntj-kmods/spu-cbc-lab/
          if-no-files-found: error
          retention-days: 30
      - name: Upload VBNT-K modules and manual-only IPKs
        if: always() && inputs.module_set != 'spu-cbc-probe'
        uses: actions/upload-artifact@v7
        with:
          name: damson-4.1.52-${{ env.MODULE_SET }}-${{ github.sha }}
          path: dist/vbntj-kmods/
          if-no-files-found: warn
          retention-days: 30

  verify_wireguard_artifact:
    if: inputs.wireguard_artifact_run_id != ''
    name: Verify existing WireGuard 4.1.52 artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Download existing WireGuard artifacts
        uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.wireguard_artifact_run_id }}
          pattern: damson-4.1.52-wireguard-*
          merge-multiple: true
          path: dist/vbntj-kmods
      - name: Verify checksums
        run: cd dist/vbntj-kmods && sha256sum --check SHA256SUMS
      - name: Verify manual-only IPK safety and WireGuard module
        run: scripts/verify-wireguard-kmod.sh dist/vbntj-kmods 4.1.52
