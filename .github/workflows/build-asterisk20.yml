name: Asterisk 20 verified OPKG feed

on:
  workflow_call:
    inputs:
      reuse_run_id:
        description: "Completed run with successful Asterisk output to reuse instead of rebuilding"
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      reuse_run_id:
        description: "Completed run with successful Asterisk output to reuse instead of rebuilding"
        type: string
        required: false

permissions:
  contents: read
  actions: read

jobs:
  asterisk:
    name: Build and verify Asterisk 20 feed
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      PACKAGE_TARGETS: feeds/telephony/asterisk
      BUILD_CONFIG: /repo/build/asterisk20.config
      ENABLE_ASTERISK20: "1"
      USERSPACE_ONLY: "1"
      GH_TOKEN: ${{ github.token }}
      BUILD_INPUTS_TAG: build-inputs-v1
      SOURCE_RUN_ID: ${{ inputs.reuse_run_id || github.run_id }}
      SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Restore source archive cache
        if: inputs.reuse_run_id == ''
        uses: actions/cache@v6
        with:
          path: |
            .cache/sources
            .cache/downloads
          key: openwrt-inputs-${{ hashFiles('build/checksums.sha256') }}

      - name: Install archive downloader
        if: inputs.reuse_run_id == ''
        run: |
          sudo apt-get update
          sudo apt-get install --yes megatools

      - name: Download and verify build inputs
        if: inputs.reuse_run_id == ''
        run: scripts/fetch-build-inputs.sh

      - name: Build compatibility image
        if: inputs.reuse_run_id == ''
        run: docker build --platform linux/amd64 --tag gui-ipk-builder --file build/Dockerfile .

      - name: Compile SIP/PJSIP profile
        if: inputs.reuse_run_id == ''
        run: |
          docker run --rm --platform linux/amd64 \
            --user "$(id -u):$(id -g)" --env HOME=/tmp --env JOBS="$(nproc)" \
            --env PACKAGE_TARGETS --env BUILD_CONFIG --env ENABLE_ASTERISK20 \
            --env USERSPACE_ONLY --env WORK_DIR=/tmp/openwrt \
            --volume "$PWD:/repo" gui-ipk-builder

      - name: Verify reused artifact provenance
        if: inputs.reuse_run_id != ''
        run: |
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > source-run.json
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          run = json.loads(Path("source-run.json").read_text())
          assert run["status"] == "completed", "Source run is not complete"
          assert run["path"].split("@", 1)[0] in (".github/workflows/build-packages.yml", ".github/workflows/build-asterisk20.yml"), "Unexpected source workflow"
          assert run["head_repository"]["full_name"] == os.environ["GITHUB_REPOSITORY"], "Source run belongs to another repository"
          assert re.fullmatch(r"[0-9a-f]{40}", run["head_sha"])
          import subprocess
          prefix = "repos/{}/actions/runs/{}".format(os.environ["GITHUB_REPOSITORY"], os.environ["SOURCE_RUN_ID"])
          comparison = json.loads(subprocess.check_output(["gh", "api", "repos/{}/compare/{}...{}".format(os.environ["GITHUB_REPOSITORY"], run["head_sha"], os.environ["GITHUB_SHA"])]))
          assert comparison["status"] in ("identical", "ahead"), "Source revision is not an ancestor"
          artifacts = json.loads(subprocess.check_output(["gh", "api", prefix + "/artifacts?per_page=100"]))["artifacts"]
          assembled_name = "asterisk20-opkg-feed-" + os.environ["SOURCE_RUN_ID"]
          assembled = any(item["name"] == assembled_name and not item["expired"] for item in artifacts)
          if assembled:
              jobs = json.loads(subprocess.check_output(["gh", "api", prefix + "/jobs?per_page=100"]))["jobs"]
              assert any(job["name"].split(" / ")[-1] == "Build and verify Asterisk 20 feed" and job["conclusion"] == "success" for job in jobs), "Asterisk source job did not succeed"
          else:
              assert run["conclusion"] == "success", "Targeted source run did not succeed"
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("SOURCE_ASSEMBLED=" + str(int(assembled)) + "\n")
              env.write("SOURCE_ARTIFACT=" + (assembled_name if assembled else "userspace-shard-0-" + os.environ["SOURCE_RUN_ID"]) + "\n")
              env.write("SOURCE_COMMIT=" + run["head_sha"] + "\n")
          PY

      - name: Download verified Asterisk build output
        if: inputs.reuse_run_id != ''
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          run-id: ${{ inputs.reuse_run_id }}
          github-token: ${{ github.token }}
          path: ${{ env.SOURCE_ASSEMBLED == '1' && 'asterisk20-feed' || 'dist' }}

      - name: Assemble dedicated feed
        if: env.SOURCE_ASSEMBLED != '1'
        run: |
          python3 scripts/assemble-asterisk-feed.py dist asterisk20-feed \
            --source-run-id "$SOURCE_RUN_ID" --source-commit "$SOURCE_COMMIT"

      - name: Verify assembled feed files
        run: scripts/verify-feed.sh asterisk20-feed

      - name: Upload verified Asterisk feed
        uses: actions/upload-artifact@v7
        with:
          name: asterisk20-opkg-feed-${{ github.run_id }}
          path: asterisk20-feed/
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: asterisk20-diagnostics-${{ github.run_id }}
          path: |
            dist/failed-packages.md
            dist/serial-package-compile.log
          if-no-files-found: warn
          retention-days: 30
