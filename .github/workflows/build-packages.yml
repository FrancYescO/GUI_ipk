name: Userspace OPKG feed (brcm63xx-tch)

on:
  workflow_dispatch:
    inputs:
      package_targets:
        description: "Optional recipe paths for a targeted build (empty builds everything)"
        required: false
        type: string
      publish_pages:
        description: "Publish the completed feed to GitHub Pages"
        required: true
        default: true
        type: boolean
  pull_request:
    paths:
      - ".github/workflows/build-packages.yml"
      - "build/**"
      - "patches/userspace-package-metadata.patch"
      - "patches/userspace-no-all-kmods.patch"
      - "patches/userspace-skip-kernel-package.patch"
      - "patches/libpcap-c99.patch"
      - "patches/olsrd-release-flags.patch"
      - "scripts/build-packages.sh"
      - "scripts/fetch-build-inputs.sh"
      - "scripts/sanitize-opkg-feed.sh"
      - "scripts/verify-feed.sh"
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-packages.yml"
      - "build/**"
      - "patches/userspace-package-metadata.patch"
      - "patches/userspace-no-all-kmods.patch"
      - "patches/userspace-skip-kernel-package.patch"
      - "patches/libpcap-c99.patch"
      - "patches/olsrd-release-flags.patch"
      - "scripts/build-packages.sh"
      - "scripts/fetch-build-inputs.sh"
      - "scripts/sanitize-opkg-feed.sh"
      - "scripts/verify-feed.sh"

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.package_targets == '' && 'Full userspace OPKG feed' || 'Targeted userspace build' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PACKAGE_TARGETS: ${{ inputs.package_targets }}
      BUILD_CONFIG: /repo/build/userspace.config
      USERSPACE_ONLY: "1"
      GH_TOKEN: ${{ github.token }}
      BUILD_INPUTS_TAG: build-inputs-v1
    steps:
      - uses: actions/checkout@v7

      - name: Restore source archive cache
        uses: actions/cache@v6
        with:
          path: |
            .cache/sources
            .cache/downloads
          key: openwrt-inputs-${{ hashFiles('build/checksums.sha256') }}

      - name: Install archive downloader
        run: |
          sudo apt-get update
          sudo apt-get install --yes megatools

      - name: Download and verify build inputs
        run: scripts/fetch-build-inputs.sh

      - name: Build compatibility image
        run: docker build --platform linux/amd64 --tag gui-ipk-builder --file build/Dockerfile .

      - name: Compile packages
        run: |
          docker run --rm \
            --platform linux/amd64 \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --env JOBS="$(nproc)" \
            --env PACKAGE_TARGETS \
            --env BUILD_CONFIG \
            --env USERSPACE_ONLY \
            --env WORK_DIR=/tmp/openwrt \
            --volume "$PWD:/repo" \
            gui-ipk-builder

      - name: Upload serial compile log after failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: userspace-compile-failure-${{ github.sha }}
          path: dist/serial-package-compile.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare safe shared OPKG feed
        run: scripts/sanitize-opkg-feed.sh dist

      - name: Verify package feed
        run: scripts/verify-feed.sh dist

      - name: Add versioned kernel feeds
        run: |
          (cd artifacts/damson-4.1.52-manual && sha256sum --check SHA256SUMS)
          scripts/verify-manual-kmod-ipks.sh artifacts/damson-4.1.52-manual
          (cd artifacts/damson-4.1.52-network && sha256sum --check SHA256SUMS)
          scripts/verify-manual-kmod-ipks.sh artifacts/damson-4.1.52-network
          test "$(find artifacts/damson-4.1.52-network -maxdepth 1 -name 'kmod-*.ipk' -type f | wc -l)" -eq 44
          (cd artifacts/buildroot-4.1.38 && sha256sum --check SHA256SUMS)
          scripts/verify-kmod-tun.sh artifacts/buildroot-4.1.38
          scripts/verify-kmod-connmark.sh artifacts/buildroot-4.1.38
          python3 scripts/assemble-kernel-feed.py artifacts/damson-4.1.52-manual dist --damson-extra-dir artifacts/damson-4.1.52-network --buildroot-kernel-dir artifacts/buildroot-4.1.38
          scripts/verify-feed.sh dist --allow-kmods

      - name: Generate browsable package pages
        run: python3 scripts/generate-feed-pages.py dist

      - name: Upload package feed
        uses: actions/upload-artifact@v7
        with:
          name: userspace-opkg-feed-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish_pages && inputs.package_targets == ''
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    name: Publish verified package feed to Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish_pages && inputs.package_targets == ''
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy package feed
        id: deployment
        uses: actions/deploy-pages@v5
